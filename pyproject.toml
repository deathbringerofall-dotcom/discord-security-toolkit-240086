[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-security-toolkit"
version = "0.1.0"
description = "Offline Discord security toolkit modules that do not require API keys"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
